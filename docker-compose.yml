# Builds the image from this folder's Dockerfile.
# Run from the project folder:  docker compose up -d --build
# Settings are kept in ./data/config.json on the host.
services:
  discord-ai-multibot-manager:
    build: .
    container_name: discord-ai-multibot-manager
    restart: unless-stopped
    ports:
      - "3010:3000"
    volumes:
      - ./data:/app/data
