# Push-button deploy: in Portainer, add a stack with Build method "Repository",
# point it at this repo, compose path docker-compose.yml. The image is built by
# GitHub Actions on every push to main and published to ghcr.io, so Portainer
# only pulls it (no build on the server). Settings (bot tokens, API keys,
# passcode) live in the named volume below and survive redeploys.
# To build locally instead: docker compose -f docker-compose.build.yml up -d --build
services:
  discord-ai-multibot-manager:
    image: ghcr.io/misterrat/discord-ai-multibot-manager:latest
    pull_policy: always
    container_name: discord-ai-multibot-manager
    restart: unless-stopped
    ports:
      - "3010:3000"
    volumes:
      - multibot_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CONFIG_PATH=/app/data/config.json
      # Forgot your passcode? Set RESET_ADMIN_PASSCODE=true in the stack's environment variables and redeploy.
      - RESET_ADMIN_PASSCODE=${RESET_ADMIN_PASSCODE:-false}

volumes:
  multibot_data:
